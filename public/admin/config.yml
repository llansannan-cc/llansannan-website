# Decap CMS configuration for Llansannan Community Council
# See DECAP_CMS_SETUP.md in the repo root for the full setup walkthrough.

backend:
  name: github
  repo: llansannan-cc/llansannan-website
  branch: main
  base_url: https://llansannan-cms-auth.llansannancc.workers.dev
  auth_endpoint: auth

# The CMS only ever writes to these four JSON files and the shared uploads
# folder below. It has no access to templates, layouts, or site design -
# those live in src/layouts and src/pages, which are not exposed here.
# (Note: this restricts what the CMS *interface* allows. Anyone with GitHub
# write access to the repository could still edit any file directly on
# GitHub.com or via git -see DATA_PROCESSING_NOTE.md.)

publish_mode: simple
show_preview_links: false

media_folder: "public/documents/uploads"
public_folder: "/documents/uploads"

locale: "en"

collections:
  - name: "meetings"
    label: "Meetings"
    label_singular: "Meeting"
    files:
      - name: "schedule"
        file: "src/data/meetings.json"
        label: "Meeting Schedule"
        description: "The council's meeting calendar. Add next year's dates here each December."
        fields:
          - name: "schedule_2026"
            label: "Meetings"
            widget: "list"
            summary: "{{fields.date}} -{{fields.type_en}}"
            fields:
              - { name: "date", label: "Meeting date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "The Welsh and English date shown on the site is generated automatically from this." }
              - { name: "type_cy", label: "Math o gyfarfod (Cymraeg)", widget: "string", default: "Cyfarfod Cyffredin" }
              - { name: "type_en", label: "Meeting type (English)", widget: "string", default: "Ordinary Meeting" }
              - name: "time"
                label: "Time"
                widget: "select"
                default: "19:00"
                options: ["09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30","22:00"]
              - name: "status"
                label: "Status"
                widget: "select"
                options:
                  - { label: "Past", value: "past" }
                  - { label: "Next meeting", value: "next" }
                  - { label: "Upcoming", value: "upcoming" }
                hint: "Only one meeting should be set to 'Next meeting' at a time."

  - name: "minutes"
    label: "Minutes"
    label_singular: "Minutes"
    files:
      - name: "minutes"
        file: "src/data/minutes.json"
        label: "Meeting Minutes"
        fields:
          - name: "items"
            label: "Minutes"
            widget: "list"
            summary: "{{meeting_date}} -{{meeting_type_en}} ({{status}})"
            fields:
              - { name: "meeting_date", label: "Meeting date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { name: "meeting_type_cy", label: "Math o gyfarfod (Cymraeg)", widget: "string", default: "Cyfarfod Cyffredin" }
              - { name: "meeting_type_en", label: "Meeting type (English)", widget: "string", default: "Ordinary Meeting" }
              - name: "status"
                label: "Status"
                widget: "select"
                options:
                  - { label: "Draft (not yet approved)", value: "draft" }
                  - { label: "Approved -publish on site", value: "approved" }
                hint: "Only 'Approved' minutes appear on the public Minutes page."
              - { name: "chair", label: "Chair", widget: "string" }
              - name: "minutes_cy_file"
                label: "Cofnodion PDF (Cymraeg)"
                widget: "file"
                media_library: { config: { multiple: false } }
                hint: "PDF only, under 10MB. Must be a proper searchable/tagged PDF, not a scanned image -see the accessible PDF note in DECAP_CMS_SETUP.md."
              - name: "minutes_en_file"
                label: "Minutes PDF (English)"
                widget: "file"
                media_library: { config: { multiple: false } }
                hint: "PDF only, under 10MB. Must be a proper searchable/tagged PDF, not a scanned image."

  - name: "agendas"
    label: "Agendas"
    label_singular: "Agenda"
    files:
      - name: "agendas"
        file: "src/data/agendas.json"
        label: "Meeting Agendas"
        fields:
          - name: "items"
            label: "Agendas"
            widget: "list"
            summary: "{{meeting_date}} -{{meeting_type_en}}"
            fields:
              - { name: "meeting_date", label: "Meeting date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { name: "meeting_type_cy", label: "Math o gyfarfod (Cymraeg)", widget: "string", default: "Cyfarfod Cyffredin" }
              - { name: "meeting_type_en", label: "Meeting type (English)", widget: "string", default: "Ordinary Meeting" }
              - name: "agenda_cy_file"
                label: "Agenda PDF (Cymraeg)"
                widget: "file"
                media_library: { config: { multiple: false } }
                hint: "PDF only, under 10MB. Publish at least 3 clear days before the meeting."
              - name: "agenda_en_file"
                label: "Agenda PDF (English)"
                widget: "file"
                media_library: { config: { multiple: false } }
                hint: "PDF only, under 10MB. Publish at least 3 clear days before the meeting."

  - name: "events"
    label: "Events"
    label_singular: "Event"
    files:
      - name: "events"
        file: "src/data/events.json"
        label: "Community Events"
        fields:
          - name: "items"
            label: "Events"
            widget: "list"
            summary: "{{date}} -{{title_en}}"
            fields:
              - { name: "title_cy", label: "Teitl (Cymraeg)", widget: "string" }
              - { name: "title_en", label: "Title (English)", widget: "string" }
              - { name: "date", label: "Date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "Events drop off the public calendar automatically once this date has passed." }
              - name: "time"
                label: "Time"
                widget: "select"
                required: false
                hint: "Choose 'All day' for events with no set start time."
                options:
                  - { label: "All day", value: "" }
                  - "09:00"
                  - "09:30"
                  - "10:00"
                  - "10:30"
                  - "11:00"
                  - "11:30"
                  - "12:00"
                  - "12:30"
                  - "13:00"
                  - "13:30"
                  - "14:00"
                  - "14:30"
                  - "15:00"
                  - "15:30"
                  - "16:00"
                  - "16:30"
                  - "17:00"
                  - "17:30"
                  - "18:00"
                  - "18:30"
                  - "19:00"
                  - "19:30"
                  - "20:00"
                  - "20:30"
                  - "21:00"
                  - "21:30"
                  - "22:00"
              - { name: "location_cy", label: "Lleoliad (Cymraeg)", widget: "string" }
              - { name: "location_en", label: "Location (English)", widget: "string" }
              - { name: "description_cy", label: "Disgrifiad (Cymraeg)", widget: "text", required: false }
              - { name: "description_en", label: "Description (English)", widget: "text", required: false }

  - name: "people"
    label: "Councillors & Officers"
    label_singular: "Person"
    files:
      - name: "people"
        file: "src/data/councillors.json"
        label: "Councillors, Chair, Clerk & Officers"
        description: "One list for everyone: the Chair, the Clerk, all councillors, and any vacant seats. This is the ONLY place their names live -- every page that mentions the Chair or Clerk by name reads from here, so there's nothing else to keep in sync."
        fields:
          - name: "people"
            label: "People"
            widget: "list"
            summary: "{{name}} - {{fields.role}} ({{fields.ward}})"
            fields:
              - name: "name"
                label: "Name"
                widget: "string"
                required: false
                hint: "Leave blank for a vacant seat and set Active to No."
              - name: "role"
                label: "Role"
                widget: "select"
                options:
                  - { label: "Chair", value: "chair" }
                  - { label: "Vice-Chair", value: "vice_chair" }
                  - { label: "Councillor", value: "councillor" }
                  - { label: "Clerk", value: "clerk" }
                  - { label: "Responsible Financial Officer", value: "rfo" }
                  - { label: "Vacant seat", value: "vacant" }
                hint: "Exactly one active person should be 'Chair' and one 'Clerk' at a time -- both are shown by name across the site."
              - name: "ward"
                label: "Ward"
                widget: "select"
                options:
                  - { label: "Llansannan Ward", value: "llansannan" }
                  - { label: "Bylchau Ward", value: "bylchau" }
                  - { label: "Llannefydd Ward", value: "llannefydd" }
                  - { label: "Council Staff (not ward-elected, e.g. Clerk)", value: "staff" }
              - name: "active"
                label: "Active"
                widget: "boolean"
                default: true
                hint: "Set to No for a vacant seat, or when someone has stood down, instead of deleting the entry."

  - name: "news"
    label: "News"
    label_singular: "News post"
    files:
      - name: "news"
        file: "src/data/news.json"
        label: "News Posts"
        description: "Short news items. 'Featured' posts also appear on the homepage (up to 3 at a time, newest first). All posts appear on the News page until their expiry date, if one is set."
        fields:
          - name: "items"
            label: "News posts"
            widget: "list"
            summary: "{{fields.date}} -{{fields.title_en}}"
            fields:
              - { name: "title_cy", label: "Teitl (Cymraeg)", widget: "string" }
              - { name: "title_en", label: "Title (English)", widget: "string" }
              - { name: "date", label: "Date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { name: "body_cy", label: "Corff y neges (Cymraeg)", widget: "text" }
              - { name: "body_en", label: "Body text (English)", widget: "text" }
              - name: "featured"
                label: "Show on homepage"
                widget: "boolean"
                default: false
                hint: "Featured posts appear at the top of the homepage. Only the 3 most recent featured posts are shown there."
              - name: "expires"
                label: "Expiry date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                picker_utc: true
                required: false
                hint: "Optional. Once this date has passed, the post stops appearing on the site automatically -- like events do. Leave blank to keep it up indefinitely."

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        file: "src/data/site-settings.json"
        label: "Contact & Social Details"
        description: "Site-wide contact details, the usual meeting venue, and social media links. (The council's name and web address are set in code, not here, since they almost never change.)"
        fields:
          - name: "council"
            label: "Council contact details"
            widget: "object"
            fields:
              - { name: "email", label: "Contact email", widget: "string", hint: "Shown across the site (contact page, footer, meetings, policies). Must be a real, monitored inbox." }
              - { name: "address_cy", label: "Cyfeiriad post (Cymraeg)", widget: "string" }
              - { name: "address_en", label: "Postal address (English)", widget: "string" }
          - name: "meeting_defaults"
            label: "Usual meeting venue"
            widget: "object"
            fields:
              - { name: "location_cy", label: "Lleoliad arferol (Cymraeg)", widget: "string" }
              - { name: "location_en", label: "Usual venue (English)", widget: "string" }
          - name: "social"
            label: "Social media links"
            widget: "object"
            fields:
              - { name: "facebook", label: "Facebook page URL", widget: "string", required: false, hint: "Leave blank to hide the Facebook link in the footer." }
              - { name: "twitter", label: "Twitter / X profile URL", widget: "string", required: false, hint: "Leave blank to hide the Twitter/X link in the footer." }

  - name: "documents"
    label: "Policy Documents"
    files:
      - name: "documents"
        file: "src/data/documents.json"
        label: "Policy & Financial Documents"
        description: "Several pages show 'Coming soon' until a document is uploaded here. As soon as a PDF is attached below, the real download link appears on the live page automatically -- no code change needed."
        fields:
          - name: "payments"
            label: "Councillor Payments (2025/26) -- on the Councillor Payments page"
            widget: "object"
            fields:
              - { name: "file_cy", label: "PDF (Cymraeg)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
              - { name: "file_en", label: "PDF (English)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
          - name: "what_we_spend"
            label: "2026/27 Budget and Precept -- on the What We Spend page"
            widget: "object"
            fields:
              - { name: "file_cy", label: "PDF (Cymraeg)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
              - { name: "file_en", label: "PDF (English)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
          - name: "annual_return"
            label: "AGAR 2024/25 -- on the Annual Return page"
            widget: "object"
            fields:
              - { name: "file_cy", label: "PDF (Cymraeg)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
              - { name: "file_en", label: "PDF (English)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
          - name: "standing_orders"
            label: "Standing Orders -- on the Standing Orders page"
            widget: "object"
            fields:
              - { name: "file_cy", label: "PDF (Cymraeg)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
              - { name: "file_en", label: "PDF (English)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
          - name: "financial_regulations"
            label: "Financial Regulations -- on the Financial Regulations page"
            widget: "object"
            fields:
              - { name: "file_cy", label: "PDF (Cymraeg)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
              - { name: "file_en", label: "PDF (English)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
          - name: "social_media"
            label: "Social Media Policy -- on the Social Media Guidelines page"
            widget: "object"
            fields:
              - { name: "file_cy", label: "PDF (Cymraeg)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
              - { name: "file_en", label: "PDF (English)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
          - name: "biodiversity"
            label: "Biodiversity Policy -- on the Biodiversity Policy page"
            widget: "object"
            fields:
              - { name: "file_cy", label: "PDF (Cymraeg)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
              - { name: "file_en", label: "PDF (English)", widget: "file", required: false, media_library: { config: { multiple: false } }, hint: "PDF only, under 10MB." }
